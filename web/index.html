<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="TaskFlow — A lightweight project and task manager for organizations.">
  <meta name="theme-color" content="#5B5BD6">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TaskFlow">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-192.png">

  <title>TaskFlow — Project & Task Management</title>
  <link rel="manifest" href="manifest.json">

  <style>
    :root {
      --bg-color: #0d0e14;
      --text-main: #f0f1f7;
      --text-muted: #8b8f9e;
      --primary: #5B5BD6;
      --primary-dark: #3b3b98;
      --loader-track: rgba(255, 255, 255, 0.08);
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg-color: #f7f7fa;
        --text-main: #16161d;
        --text-muted: #60646c;
        --loader-track: rgba(0, 0, 0, 0.06);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    #app-splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-color);
      z-index: 99999;
      transition: opacity 0.45s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.45s;
    }

    #app-splash.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 24px;
      animation: splashAppear 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .brand-logo-wrapper {
      position: relative;
      width: 80px;
      height: 80px;
      margin-bottom: 24px;
    }

    .brand-logo-glow {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 24px;
      background: radial-gradient(circle, rgba(91, 91, 214, 0.45) 0%, rgba(91, 91, 214, 0) 70%);
      filter: blur(14px);
      animation: pulseGlow 2.4s ease-in-out infinite alternate;
    }

    .brand-logo {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 22px;
      background: linear-gradient(135deg, #5B5BD6 0%, #3B3B98 100%);
      box-shadow: 0 12px 28px rgba(91, 91, 214, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-logo svg {
      width: 44px;
      height: 44px;
      fill: none;
      stroke: #ffffff;
      stroke-width: 3.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.2));
    }

    .app-title {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    .app-tagline {
      font-size: 14px;
      font-weight: 400;
      color: var(--text-muted);
      margin-bottom: 32px;
      letter-spacing: -0.1px;
    }

    .loader-bar-container {
      width: 130px;
      height: 4px;
      background: var(--loader-track);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }

    .loader-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 40%;
      background: linear-gradient(90deg, #5B5BD6, #8B8BFA);
      border-radius: 4px;
      animation: loadSlide 1.4s infinite cubic-bezier(0.65, 0.05, 0.36, 1);
    }

    @keyframes splashAppear {
      0% {
        opacity: 0;
        transform: translateY(12px) scale(0.96);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes pulseGlow {
      0% {
        transform: scale(0.9);
        opacity: 0.5;
      }
      100% {
        transform: scale(1.3);
        opacity: 0.9;
      }
    }

    @keyframes loadSlide {
      0% {
        left: -40%;
        width: 30%;
      }
      50% {
        left: 30%;
        width: 50%;
      }
      100% {
        left: 100%;
        width: 30%;
      }
    }
  </style>
</head>
<body>
  <!-- Native Web Pre-loader / Splash Overlay -->
  <div id="app-splash">
    <div class="splash-container">
      <div class="brand-logo-wrapper">
        <div class="brand-logo-glow"></div>
        <div class="brand-logo">
          <svg viewBox="0 0 24 24">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </div>
      </div>
      <h1 class="app-title">TaskFlow</h1>
      <p class="app-tagline">Projects, tasks and the people on them</p>
      <div class="loader-bar-container">
        <div class="loader-bar"></div>
      </div>
    </div>
  </div>

  <script>
    // Remove splash overlay when Flutter renders its first frame
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('app-splash');
      if (splash) {
        splash.classList.add('fade-out');
        setTimeout(function () {
          if (splash.parentNode) {
            splash.parentNode.removeChild(splash);
          }
        }, 500);
      }
    });

    // Fallback safety timeout in case event doesn't trigger
    setTimeout(function () {
      var splash = document.getElementById('app-splash');
      if (splash && !splash.classList.contains('fade-out')) {
        splash.classList.add('fade-out');
      }
    }, 6000);
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
