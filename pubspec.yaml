name: taskflow
description: "TaskFlow - lightweight project and task management (mock data edition)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management + DI
  provider: ^6.1.2
  get_it: ^8.0.3

  # Navigation
  go_router: ^14.6.2

  # Storage
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.4

  # Misc
  equatable: ^2.0.7
  intl: ^0.20.1
  local_auth: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/mock_data/
